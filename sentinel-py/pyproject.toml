[project]
name = "sentinel-coordination"
version = "0.2.0"
description = "Execution coordination primitive with leases, fencing tokens, and reconciliation semantics."
authors = [
  { name = "Sreejay Reddy", email = "reddysreejay@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["psycopg[binary]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentinel"]