[project]
name = "sentinel-coordination"
version = "0.4.0"
description = "PostgreSQL-backed execution coordination primitive for correctness-sensitive distributed work."
authors = [
  { name = "Sreejay Reddy", email = "reddysreejay@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["psycopg[binary]"]

keywords = [
  "postgresql",
  "distributed-systems",
  "idempotency",
  "execution-coordination",
  "fault-tolerance",
  "concurrency",
  "fencing-tokens"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: System :: Distributed Computing",
  "Topic :: Database"
]

license = { file = "LICENSE" }

[project.optional-dependencies]
django = ["django>=4.2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "sentinel",
  "sentinel.integrations",
  "sentinel.integrations.migrations"
]

[project.urls]
Homepage = "https://github.com/sreejay-reddy/sentinel"
Repository = "https://github.com/sreejay-reddy/sentinel"
Issues = "https://github.com/sreejay-reddy/sentinel/issues"
Documentation = "https://github.com/sreejay-reddy/sentinel#readme"
